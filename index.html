<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCIIRender - Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&family=VT323&family=Source+Code+Pro:wght@400;600&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: #e2e8f0;
      }
      
      .font-mono {
        font-family: 'Fira Code', monospace;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      
      /* Checkerboard pattern for transparency */
      .bg-checkerboard {
        background-color: #1e293b;
        background-image:
          linear-gradient(45deg, #0f172a 25%, transparent 25%),
          linear-gradient(-45deg, #0f172a 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #0f172a 75%),
          linear-gradient(-45deg, transparent 75%, #0f172a 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./demo/index.tsx"></script>
  </body>
</html>
